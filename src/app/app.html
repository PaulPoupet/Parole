<div class="app">
  <header class="app-header">
    <div class="header-title">
      <mat-icon>record_voice_over</mat-icon>
      <div>
        <h1>Assistant Phonétique</h1>
        <p>Assemblez des phonèmes IPA pour former des mots</p>
      </div>
    </div>
  </header>

  <main class="app-body">
    <!-- Constructeur de mot -->
    <section class="card">
      <h2 class="section-title">Mot assemblé</h2>
      <cm-word-builder #builder />
    </section>

    <!-- Clavier phonétique -->
    <section class="card">
      <h2 class="section-title">Clavier IPA — Français</h2>
      <cm-phoneme-keyboard (selected)="builder.addPhoneme($event)" />
    </section>
  </main>
</div>
